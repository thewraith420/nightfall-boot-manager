# Add to /etc/grub.d/40_custom (or /boot/grub/custom.cfg) on the real
# installed system, then regenerate grub.cfg.
#
# Rollout plan (Bob's call): NOT made the default/only path until the
# picker has proven itself. Land this as a plain selectable entry first
# - normal GRUB_DEFAULT and GRUB_TIMEOUT stay untouched, so GRUB's own
# menu/timeout is still there as the real fallback during testing (in
# practice: a long power-button press, not the initramfs rescue shell -
# see initramfs/README.md). Only once the picker's been proven reliable
# through real use does it make sense to flip to:
#
#   GRUB_DEFAULT=picker
#   GRUB_TIMEOUT=0
#
# which is what makes the picker the *only* thing a user ever sees.
#
# No GRUB_DISABLE_SUBMENU needed - initramfs/discover-kernels.sh walks
# into "Advanced options" submenus itself, since real-world testing
# showed that's where most distros actually nest kernel entries.
#
# Update the linux/initrd paths below once picker-kernel + initramfs
# build outputs land somewhere real under /boot.
#
# PREFER install-nightfall.sh over pasting this by hand: it resolves the
# right path prefix for whether /boot is its own partition, adds the
# search --fs-uuid line, refuses to run under GRUB_DEFAULT=saved, and
# derives the kernel cmdline below from /proc/cmdline automatically.
#
# THE CMDLINE IS NOT OPTIONAL - MATCH IT TO YOUR OWN BOOT, DON'T COPY THIS
# BLINDLY. A bare `linux /boot/nightfall/vmlinuz` cost a full boot cycle:
# on picker-kernel 7.1.12 the Slate's panel produced NO VISIBLE OUTPUT
# without i915.enable_dpcd_backlight=2 and i915.enable_psr=0, and it
# failed silently in the worst way - drmModeSetCrtc returns SUCCESS, so
# Nightfall cannot detect it. The modeset works; the backlight never
# lights. Everything ran perfectly against a black screen: touch found,
# menu rendered, timeout fired, kexec completed.
#
# CONFIRMED 2026-09-30: on nightfall-kernel 7.2.7, with this Slate's
# current coreboot firmware (a MrChromebox prerelease), both options are
# redundant, not just untested. enable_psr=0 is a no-op - kernel patch
# 9208 applies the same PSR-disable itself, via a DMI quirk. And
# enable_dpcd_backlight=2 reaches the exact code path AUTO already does,
# because coreboot's own VBT (BDB 221, panel_type 15) already selects
# VESA_EDP_AUX_INTERFACE as this panel's backlight method - confirmed by
# reading the live vbt.bin, not inferred. install-nightfall.sh no longer
# forces them; whatever the running boot's cmdline actually carries is
# still copied forward as-is.
#
# THAT IS SPECIFIC TO THIS BOARD'S CURRENT FIRMWARE, NOT A GENERAL RULE.
# A different coreboot build's VBT could pick a different default
# backlight method for the same panel_type - which is exactly why these
# flags were needed in the first place. Re-flashing to an older or stock
# firmware is reason to re-check this, not assume it still holds.
#
# These are this panel's quirks. On other hardware, copy whatever
# display-related options the working entries in your own grub.cfg
# already carry - that set is, by definition, known to light the panel.

menuentry 'Nightfall Boot Manager' --id nightfall {
        insmod gzio
        insmod part_gpt
        insmod ext2
        linux   /boot/nightfall/vmlinuz quiet loglevel=3 vt.global_cursor_default=0
        initrd  /boot/nightfall/initramfs.img
}
